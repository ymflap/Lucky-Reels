name: Lucky-Reels CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate project configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('tsconfig.json', 'utf8'))"

      - name: Install dependencies
        run: npm install

      - name: Build application
        if: hashFiles('index.html', 'src/client/main.tsx') != ''
        run: npm run build

      - name: Run tests
        if: hashFiles('tests/**/*.test.ts', 'tests/**/*.test.tsx') != ''
        run: npm test

      - name: Report staged setup
        if: hashFiles('index.html', 'src/client/main.tsx') == ''
        run: echo "Build deferred until the application entry files are added."
        
